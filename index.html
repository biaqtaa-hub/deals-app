<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Скидки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f1f2f6);
    --text: var(--tg-theme-text-color, #15161a);
    --hint: var(--tg-theme-hint-color, #8b8e98);
    --accent: var(--tg-theme-button-color, #2f7cf6);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --sale: #ff3b5c;
    --green: #17a65a;
    --line: rgba(127,127,127,.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg2); color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  button { font: inherit; color: inherit; }

  /* шапка */
  .hero {
    padding: 18px 16px 14px;
    background: linear-gradient(135deg, #ff3b5c 0%, #ff8a3d 100%);
    color: #fff;
  }
  .hero h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.3px; }
  .hero p { margin: 4px 0 0; font-size: 14px; opacity: .9; }

  /* поиск (закреплён сверху) */
  .searchbar {
    position: sticky; top: 0; z-index: 10; padding: 10px 12px;
    background: var(--bg2);
  }
  .search {
    width: 100%; font-size: 17px; padding: 13px 16px; border-radius: 14px;
    border: 2px solid transparent; background: var(--bg); color: var(--text); outline: none;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .search:focus { border-color: var(--accent); }

  /* блоки фильтров */
  .panel { background: var(--bg); margin: 0 12px 10px; border-radius: 16px; padding: 12px; }
  .label { font-size: 13px; color: var(--hint); margin: 0 2px 8px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  .label { display: flex; justify-content: space-between; align-items: center; }
  .wrap + .label { margin-top: 14px; }
  .wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid2 + .label, .grid3 + .label { margin-top: 14px; }
  .tile {
    border: 0; border-radius: 14px; padding: 10px 4px; background: var(--bg2); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 600;
    transition: transform .08s;
  }
  .tile span { font-size: 24px; line-height: 1; }
  .tile:active { transform: scale(.96); }
  .tile.on { background: var(--accent); color: var(--accent-text); }
  .grid2 .chip { width: 100%; padding: 11px 6px; font-size: 14px; }
  .chip {
    border: 0; border-radius: 12px; padding: 10px 13px; font-size: 15px;
    background: var(--bg2); cursor: pointer; transition: transform .08s;
  }
  .chip:active { transform: scale(.96); }
  .chip.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .price-to {
    display: flex; align-items: center; gap: 4px; background: var(--bg2);
    border-radius: 12px; padding: 0 10px; font-size: 14px; white-space: nowrap;
  }
  .price-to input {
    width: 100%; min-width: 0; border: 0; background: transparent; color: var(--text);
    font-size: 15px; padding: 11px 0; outline: none;
  }
  .reset {
    border: 0; background: none; color: var(--sale); font-weight: 700; font-size: 13px;
    padding: 0; cursor: pointer; text-transform: none; letter-spacing: 0;
  }

  .info { color: var(--hint); font-size: 14px; padding: 2px 16px 8px; }

  /* плитка товаров */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 8px 12px; }
  .card {
    background: var(--bg); border-radius: 16px; overflow: hidden;
    display: flex; flex-direction: column; cursor: pointer;
  }
  .photo { position: relative; aspect-ratio: 1 / 1; background: #fff; }
  .photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .badge {
    position: absolute; left: 8px; top: 8px; background: var(--sale); color: #fff;
    font-weight: 800; font-size: 15px; padding: 3px 8px; border-radius: 9px;
  }
  .info-box { padding: 10px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .price { font-size: 19px; font-weight: 800; color: var(--sale); }
  .old { color: var(--hint); text-decoration: line-through; font-size: 13px; font-weight: 400; margin-left: 5px; }
  .real {
    font-size: 12px; font-weight: 700; color: var(--green); background: rgba(23,166,90,.12);
    padding: 3px 7px; border-radius: 7px; align-self: flex-start;
  }
  .name {
    font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; max-height: 2.7em;
  }
  .open {
    border: 0; border-radius: 11px; padding: 10px; font-size: 15px; font-weight: 600;
    background: var(--accent); color: var(--accent-text); cursor: pointer; width: 100%; margin-top: auto;
  }
  .more {
    display: block; margin: 0 12px 28px; width: calc(100% - 24px); border: 0; border-radius: 14px;
    padding: 14px; font-size: 16px; background: var(--bg); color: var(--accent); font-weight: 700; cursor: pointer;
  }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--hint); padding: 40px 20px; font-size: 16px; }
  .hint { font-size: 13px; color: var(--hint); padding: 0 16px 14px; }
</style>
</head>
<body>
<div class="hero">
  <h1>🛍 Скидки для своих</h1>
  <p id="upd">Загружаю товары…</p>
</div>

<div class="searchbar">
  <input id="q" class="search" type="search" placeholder="🔍 Что ищем? Например: пылесос">
</div>

<div class="panel">
  <div class="label">Категории <button id="reset" class="reset" style="display:none">✕ Сбросить всё</button></div>
  <div id="cats" class="grid3"></div>
  <div class="label">Сортировка</div>
  <div id="sorts" class="grid2"></div>
  <div class="label">Фильтры</div>
  <div class="grid2">
    <label class="price-to">До <input id="max" type="number" inputmode="numeric" placeholder="любая цена"> ₽</label>
    <button id="real" class="chip">✅ Реальные скидки</button>
  </div>
</div>

<div id="info" class="info"></div>
<div id="list" class="grid"></div>
<button id="more" class="more" style="display:none">Показать ещё</button>
<div class="hint">✅ «Реально» — бот сам видел, что цена упала. Красная скидка на фото — со слов продавца, она бывает завышенной.</div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const PAGE = 40;
let all = [], cats = [], updated = "";
// sort: null = популярные; price: "asc"/"desc"; disc: "desc"/"asc"
let state = { cat: null, price: null, disc: null, real: false, q: "", max: 0, shown: PAGE };

const $ = id => document.getElementById(id);
const money = n => n.toLocaleString("ru-RU") + " ₽";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const haptic = () => { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} };

function chip(label, on, onClick) {
  const b = document.createElement("button");
  b.className = "chip" + (on ? " on" : "");
  b.textContent = label;
  b.onclick = () => { haptic(); onClick(); state.shown = PAGE; drawControls(); draw(); };
  return b;
}

const SHORT = { "Электроника": "Электроника", "Игры и приставки": "Игры", "Бытовая техника": "Техника",
                "Детские товары": "Детям", "Товары для дома": "Для дома", "Слежки": "Мои слежки" };

function tile(name) {
  const m = name.match(/^(\S+)\s+(.*)$/);
  const icon = m ? m[1] : "🏷", text = m ? (SHORT[m[2]] || m[2]) : name;
  const b = document.createElement("button");
  b.className = "tile" + (state.cat === name ? " on" : "");
  b.innerHTML = `<span>${esc(icon)}</span>${esc(text)}`;
  b.onclick = () => { haptic(); state.cat = state.cat === name ? null : name; state.shown = PAGE; drawControls(); draw(); };
  return b;
}

function drawControls() {
  const c = $("cats"); c.innerHTML = "";
  cats.forEach(name => c.appendChild(tile(name)));

  const s = $("sorts"); s.innerHTML = "";
  const priceLabel = { null: "💰 Цена", asc: "💰 Дешёвые сначала", desc: "💰 Дорогие сначала" }[state.price];
  const discLabel = { null: "🔥 Скидка", desc: "🔥 Большие скидки", asc: "🔥 Маленькие скидки" }[state.disc];
  s.appendChild(chip(priceLabel, !!state.price, () => {
    state.price = { null: "asc", asc: "desc", desc: null }[state.price]; state.disc = null;
  }));
  s.appendChild(chip(discLabel, !!state.disc, () => {
    state.disc = { null: "desc", desc: "asc", asc: null }[state.disc]; state.price = null;
  }));

  $("real").className = "chip" + (state.real ? " on" : "");
  const any = state.cat || state.price || state.disc || state.real || state.max || state.q;
  $("reset").style.display = any ? "inline-block" : "none";
}

function filtered() {
  const words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  let list = all.filter(it =>
    (!state.cat || it.c === state.cat) &&
    (!state.max || it.p <= state.max) &&
    (!state.real || it.r >= 10) &&
    words.every(w => it.n.toLowerCase().includes(w)));
  const disc = it => state.real ? it.r : Math.max(it.d, it.r);
  if (state.price === "asc") list.sort((a, b) => a.p - b.p);
  else if (state.price === "desc") list.sort((a, b) => b.p - a.p);
  else if (state.disc === "desc") list.sort((a, b) => disc(b) - disc(a));
  else if (state.disc === "asc") list.sort((a, b) => disc(a) - disc(b));
  else list.sort((a, b) => a.k - b.k);
  return list;
}

function card(it) {
  const badge = Math.max(it.d, it.r);
  const old = it.r >= 10 && it.u ? it.u : (it.o > it.p ? it.o : 0);
  return `<div class="card" data-link="${esc(it.l)}">
    <div class="photo">
      ${it.i ? `<img src="${esc(it.i)}" loading="lazy" alt="">` : ""}
      ${badge > 0 ? `<span class="badge">−${badge}%</span>` : ""}
    </div>
    <div class="info-box">
      <div class="price">${money(it.p)}${old ? `<span class="old">${money(old)}</span>` : ""}</div>
      ${it.r >= 10 ? `<span class="real">✅ Реально −${it.r}%</span>` : ""}
      <div class="name">${esc(it.n)}</div>
      <button class="open">Открыть в Ozon</button>
    </div>
  </div>`;
}

function draw() {
  const list = filtered();
  $("list").innerHTML = list.length
    ? list.slice(0, state.shown).map(card).join("")
    : `<div class="empty">Ничего не нашлось 🤷<br>Попробуй другое слово или нажми «Сбросить всё»</div>`;
  $("more").style.display = list.length > state.shown ? "block" : "none";
  $("info").textContent = `Найдено товаров: ${list.length}`;
}

$("list").addEventListener("click", e => {
  const c = e.target.closest(".card");
  if (!c) return;
  if (tg && tg.openLink) tg.openLink(c.dataset.link); else window.open(c.dataset.link, "_blank");
});
$("more").onclick = () => { state.shown += PAGE; draw(); };
$("real").onclick = () => { haptic(); state.real = !state.real; state.shown = PAGE; drawControls(); draw(); };
$("reset").onclick = () => {
  state = { cat: null, price: null, disc: null, real: false, q: "", max: 0, shown: PAGE };
  $("q").value = ""; $("max").value = ""; drawControls(); draw();
};
let t;
$("q").oninput = e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; state.shown = PAGE; drawControls(); draw(); }, 250); };
$("max").oninput = e => { state.max = parseInt(e.target.value) || 0; state.shown = PAGE; drawControls(); draw(); };

fetch("data.json?t=" + Date.now())
  .then(r => r.json())
  .then(d => {
    all = d.items || []; cats = d.cats || []; updated = d.updated || "";
    $("upd").textContent = `Обновлено ${updated} · ${all.length} товаров со скидкой`;
    drawControls(); draw();
  })
  .catch(() => {
    $("upd").textContent = "Товаров пока нет";
    $("list").innerHTML = `<div class="empty">😴 Бот ещё собирает скидки.<br>Загляни через полчаса.</div>`;
  });
drawControls();
</script>
</body>
</html>
